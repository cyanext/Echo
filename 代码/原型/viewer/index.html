<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 会话浏览</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="session-head">
  <div class="title-row">
    <h1 id="title"></h1>
    <button id="copy-resume" type="button">复制恢复命令</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="在本会话里搜索">
    <span id="hits"></span>
    <label><input type="checkbox" id="show-thinking" checked> 思考过程</label>
    <label><input type="checkbox" id="show-tools" checked> 工具调用</label>
    <label><input type="checkbox" id="show-system"> 系统消息</label>
    <button id="expand-all" type="button">全部展开</button>
  </div>
</header>
<main id="turns"></main>
<div id="toast" class="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
