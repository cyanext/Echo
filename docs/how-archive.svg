<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="原会话 8 GB 大多是截图和过程数据，回响的备份只留对话，约 0.8 GB；备份放在 iCloud 云盘的回响备份文件夹里，每台电脑一个文件夹">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif; }
  .ink { fill: #1d1d1f; } .ink2 { fill: #6e6e73; } .ink3 { fill: #a1a1a6; }
  .c1 { fill: #ff9f0a; } .c2 { fill: #bf5af2; } .c3 { fill: #64d2ff; } .acc { fill: #008081; } .track { fill: #e8e8ed; }
  .win { fill: #ffffff; } .frame { stroke: #d2d2d7; fill: none; } .side { fill: #f2f2f5; } .bar { fill: #f6f6f6; } .hair { stroke: #e5e5ea; }
  .stripe { fill: #f5f5f7; } .sel { fill: #0a84ff; } .selt { fill: #ffffff; } .fold { fill: #5ab0f6; } .foldt { fill: #8cc9fa; } .tri { fill: #8e8e93; } .ic { fill: #0a84ff; }
  .s { font-size: 12.5px; } .xs { font-size: 11px; } .sh { font-size: 10.5px; font-weight: 600; } .b { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #f5f5f7; } .ink2 { fill: #a1a1a6; } .ink3 { fill: #6e6e73; }
    .acc { fill: #3fc0c0; } .track { fill: #3a3a3c; }
    .win { fill: #1e1e1e; } .frame { stroke: #3a3a3c; } .side { fill: #2a2a2c; } .bar { fill: #2c2c2e; } .hair { stroke: #3a3a3c; }
    .stripe { fill: #252527; } .fold { fill: #3f9ae6; } .foldt { fill: #63b0ee; }
  }
</style>

<!-- 左：容量对比，照系统设置「存储空间」的样子 -->
<text class="s ink b" x="0" y="20">Claude Code、Codex 的原会话</text>
<text class="s ink2" x="400" y="20" text-anchor="end">8.0 GB</text>
<rect class="track" x="0" y="32" width="400" height="16" rx="5"/>
<rect class="c1" x="0" y="32" width="276" height="16" rx="5"/><rect class="c1" x="270" y="32" width="6" height="16"/>
<rect class="c2" x="276" y="32" width="58" height="16"/>
<rect class="c3" x="334" y="32" width="40" height="16"/>
<rect class="acc" x="374" y="32" width="26" height="16" rx="5"/><rect class="acc" x="374" y="32" width="6" height="16"/>
<g class="xs ink2">
  <circle class="c1" cx="5" cy="66" r="4.5"/><text x="14" y="70">截图和图片</text>
  <circle class="c2" cx="94" cy="66" r="4.5"/><text x="103" y="70">工具输出</text>
  <circle class="c3" cx="170" cy="66" r="4.5"/><text x="179" y="70">思考过程</text>
  <circle class="acc" cx="246" cy="66" r="4.5"/><text x="255" y="70">对话</text>
</g>

<text class="s ink b" x="0" y="122">回响的备份</text>
<text class="s ink2" x="400" y="122" text-anchor="end">0.8 GB</text>
<rect class="track" x="0" y="134" width="400" height="16" rx="5"/>
<rect class="c2" x="0" y="134" width="14" height="16" rx="5"/><rect class="c2" x="8" y="134" width="6" height="16"/>
<rect class="acc" x="14" y="134" width="26" height="16"/>
<g class="xs ink2">
  <circle class="c2" cx="5" cy="168" r="4.5"/><text x="14" y="172">近 30 天的工具输出</text>
  <circle class="acc" cx="128" cy="168" r="4.5"/><text x="137" y="172">对话，一字不少</text>
</g>
<text class="xs ink3" x="0" y="214">图片、思考过程不备份；工具调用的细节 30 天后换成占位；</text>
<text class="xs ink3" x="0" y="232">密钥写入前打码。对话全文永久保留。</text>

<!-- 右：访达，iCloud 云盘里的回响备份 -->
<rect class="win" x="440" y="1" width="439" height="298" rx="10"/>
<path class="side" d="M450 1 h110 v298 h-110 a10 10 0 0 1 -10 -10 v-278 a10 10 0 0 1 10 -10 z"/>
<circle cx="456" cy="16" r="5.5" fill="#ff5f57"/><circle cx="474" cy="16" r="5.5" fill="#febc2e"/><circle cx="492" cy="16" r="5.5" fill="#28c840"/>
<text class="sh ink3" x="452" y="50">个人收藏</text>
<g class="s ink">
  <text x="470" y="72">最近使用</text><text x="470" y="94">应用程序</text><text x="470" y="116">桌面</text><text x="470" y="138">文稿</text>
</g>
<g fill="none" stroke="#0a84ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="458.5" cy="67.5" r="5.5"/><path d="M458.5 64.5 v3 l2 1.5"/>
  <rect x="453" y="84" width="11" height="11" rx="3"/><path d="M456 92 l2.5 -5 l2.5 5 M457 90.2 h3"/>
  <rect x="452.5" y="106" width="12" height="8.5" rx="1.5"/><path d="M456 117.5 h5"/>
  <path d="M454.5 127.5 h5 l3 3 v8 h-8 z M459.5 127.5 v3 h3"/>
</g>
<text class="sh ink3" x="452" y="168">iCloud</text>
<rect x="446" y="176" width="108" height="22" rx="5" fill="#000" opacity=".07"/>
<path class="ic" d="M454 191 a4 4 0 0 1 1 -7.8 a5 5 0 0 1 9.4 -1 a3.6 3.6 0 0 1 1 7.1 v1.7 z"/>
<text class="s ink" x="470" y="192">iCloud 云盘</text>
<line class="hair" x1="560.5" y1="1" x2="560.5" y2="299"/>
<!-- 工具栏 -->
<rect class="bar" x="561" y="1" width="318" height="40"/>
<path d="M878 1 v40" class="hair"/>
<path class="tri" d="M576 21 l6 -6 v12 z"/><path class="tri" d="M600 21 l-6 -6 v12 z" opacity=".35"/>
<text class="s ink b" x="614" y="26">回响备份</text>
<line class="hair" x1="561" y1="41.5" x2="879" y2="41.5"/>
<!-- 列表 -->
<g class="xs ink2"><text x="574" y="58">名称</text><text x="712" y="58">修改日期</text><text x="868" y="58" text-anchor="end">大小</text></g>
<line class="hair" x1="561" y1="65.5" x2="879" y2="65.5"/>
<rect class="stripe" x="561" y="88" width="318" height="22"/><rect class="stripe" x="561" y="132" width="318" height="22"/><rect class="stripe" x="561" y="176" width="318" height="22"/>
<g class="s">
  <path class="tri" d="M568 74 l7 0 l-3.5 5 z"/>
  <path class="fold" d="M580 71 h6 l1.6 1.8 h8.4 v9.2 h-16 z"/><rect class="foldt" x="580" y="73.6" width="16" height="2"/>
  <text class="ink" x="602" y="82">MacBook Pro</text><text class="ink2" x="712" y="82">今天 17:06</text><text class="ink2" x="868" y="82" text-anchor="end">786 MB</text>

  <path class="fold" d="M598 93 h6 l1.6 1.8 h8.4 v9.2 h-16 z"/><rect class="foldt" x="598" y="95.6" width="16" height="2"/>
  <text class="ink" x="620" y="104">claude</text><text class="ink2" x="712" y="104">今天 17:06</text><text class="ink2" x="868" y="104" text-anchor="end">612 MB</text>
  <path class="fold" d="M598 115 h6 l1.6 1.8 h8.4 v9.2 h-16 z"/><rect class="foldt" x="598" y="117.6" width="16" height="2"/>
  <text class="ink" x="620" y="126">codex</text><text class="ink2" x="712" y="126">今天 17:06</text><text class="ink2" x="868" y="126" text-anchor="end">174 MB</text>

  <path class="tri" d="M568 140 l7 0 l-3.5 5 z"/>
  <path class="fold" d="M580 137 h6 l1.6 1.8 h8.4 v9.2 h-16 z"/><rect class="foldt" x="580" y="139.6" width="16" height="2"/>
  <text class="ink" x="602" y="148">家里的 iMac</text><text class="ink2" x="712" y="148">昨天 22:41</text><text class="ink2" x="868" y="148" text-anchor="end">238 MB</text>
  <path class="fold" d="M598 159 h6 l1.6 1.8 h8.4 v9.2 h-16 z"/><rect class="foldt" x="598" y="161.6" width="16" height="2"/>
  <text class="ink" x="620" y="170">claude</text><text class="ink2" x="712" y="170">昨天 22:41</text><text class="ink2" x="868" y="170" text-anchor="end">238 MB</text>
</g>
<line class="hair" x1="561" y1="268.5" x2="879" y2="268.5"/>
<text class="xs ink2" x="720" y="288" text-anchor="middle">每台电脑只写自己的文件夹，回响把它们合在一起看</text>
<rect class="frame" x="440.5" y="1.5" width="438" height="297" rx="10"/>
</svg>
