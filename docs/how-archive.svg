<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="原会话 8 GB 大多是截图和过程数据，备份只留对话，约 0.8 GB；备份放在 iCloud 云盘，每台电脑一个文件夹">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .ink { fill: #1f2328; } .ink2 { fill: #59636e; } .ink3 { fill: #8c959f; }
  .g1 { fill: #c8ced4; } .g2 { fill: #dbe0e4; } .g3 { fill: #e9ecef; } .acc { fill: #008081; }
  .win { fill: #ffffff; stroke: #d6dbdf; } .bar { fill: #f4f6f7; } .rule { stroke: #e6e9ec; } .fold { fill: #7cb7e8; }
  .s { font-size: 13px; } .xs { font-size: 11.5px; } .b { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #e6edf3; } .ink2 { fill: #9da7b1; } .ink3 { fill: #6e7781; }
    .g1 { fill: #4a535c; } .g2 { fill: #3b434b; } .g3 { fill: #30363d; } .acc { fill: #3fc0c0; }
    .win { fill: #161b22; stroke: #30363d; } .bar { fill: #1c2128; } .rule { stroke: #262c33; } .fold { fill: #5a9bd4; }
  }
</style>

<!-- 左：原会话和备份的容量对比 -->
<text class="s ink b" x="0" y="22">原会话</text>
<text class="s ink2" x="430" y="22" text-anchor="end">8.0 GB</text>
<rect class="g1" x="0" y="34" width="300" height="22" rx="3"/>
<rect class="g2" x="300" y="34" width="62" height="22"/>
<rect class="g3" x="362" y="34" width="44" height="22"/>
<rect class="acc" x="406" y="34" width="24" height="22" rx="3"/>
<text class="xs ink3" x="0" y="74">截图和图片</text>
<text class="xs ink3" x="300" y="74">工具输出</text>
<text class="xs ink3" x="362" y="74">思考</text>
<text class="xs ink3" x="430" y="74" text-anchor="end">对话</text>

<text class="s ink b" x="0" y="120">回响的备份</text>
<text class="s ink2" x="430" y="120" text-anchor="end">0.8 GB</text>
<rect class="bar" x="0" y="132" width="430" height="22" rx="3"/>
<rect class="g3" x="0" y="132" width="19" height="22" rx="3"/>
<rect class="acc" x="19" y="132" width="24" height="22"/>
<text class="xs ink3" x="0" y="172">近 30 天的工具数据</text>
<text class="xs ink2" x="0" y="206">对话全文一字不少；图片、思考不备份，</text>
<text class="xs ink2" x="0" y="226">工具调用的细节 30 天后换成占位，密钥写入前打码。</text>

<!-- 右：iCloud 云盘里的回响备份 -->
<rect class="win" x="480" y="4" width="396" height="236" rx="10" stroke-width="1"/>
<circle cx="498" cy="22" r="5" fill="#ff5f57"/><circle cx="514" cy="22" r="5" fill="#febc2e"/><circle cx="530" cy="22" r="5" fill="#28c840"/>
<text class="xs ink2" x="678" y="26" text-anchor="middle">iCloud 云盘 › 回响备份</text>
<line class="rule" x1="480" y1="40" x2="876" y2="40" stroke-width="1"/>
<text class="xs ink3" x="500" y="60">名称</text><text class="xs ink3" x="856" y="60" text-anchor="end">大小</text>
<g class="s">
  <path class="fold" d="M500 76 h7 l2 2 h9 v10 h-18 z"/><text class="ink" x="526" y="88">公司的 MacBook Pro</text>
  <path class="fold" d="M520 100 h7 l2 2 h9 v10 h-18 z"/><text class="ink2" x="546" y="112">claude</text><text class="ink2" x="856" y="112" text-anchor="end">612 MB</text>
  <path class="fold" d="M520 124 h7 l2 2 h9 v10 h-18 z"/><text class="ink2" x="546" y="136">codex</text><text class="ink2" x="856" y="136" text-anchor="end">174 MB</text>
  <path class="fold" d="M500 152 h7 l2 2 h9 v10 h-18 z"/><text class="ink" x="526" y="164">家里的 iMac</text>
  <path class="fold" d="M520 176 h7 l2 2 h9 v10 h-18 z"/><text class="ink2" x="546" y="188">claude</text><text class="ink2" x="856" y="188" text-anchor="end">238 MB</text>
</g>
<text class="xs ink3" x="500" y="224">每台电脑只写自己的文件夹，回响把它们合在一起浏览、搜索</text>
</svg>
